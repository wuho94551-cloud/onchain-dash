<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* VOICE: 감시 초소의 근무 일지, 이상 징후만 시각과 함께 기록
   IDEA: 망루에서 내려다본 호가 지형. 큰 벽은 성벽처럼, 사라지면 기록
   PICTURE: 현재가를 가운데 둔 호가 벽 사다리 + 매물대(볼륨 프로파일) 옆모습
   COLOUR and TYPE: theme.css 공통, 매수벽 초록 매도벽 빨강
   LAYOUT: 코인 입력 → 판정 요약 → 호가 벽 | 이벤트 일지 → CVD → 볼륨 프로파일 | 구조 */
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;overflow-x:clip}
.band{padding:clamp(14px,2.4vw,32px) max(4vw,14px);max-width:1240px;margin:0 auto}
h1,h2{margin:0;line-height:1.02}h2{font-size:26px}
nav.top{position:sticky;top:0;z-index:5}
nav.top .band{padding-block:10px;display:flex;gap:4px 16px;align-items:center;flex-wrap:wrap}
nav.top a{color:var(--mute);text-decoration:none;font-weight:600;min-height:44px;display:flex;align-items:center}
nav.top a[aria-current]{color:var(--ink);border-bottom:2px solid var(--ink)}
.brand{margin-right:auto}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
button,input{font:inherit;font-size:16px}
button{min-height:44px;padding:0 16px;border:0;cursor:pointer;white-space:nowrap}
input{min-height:44px;padding:0 12px;border:1px solid var(--line);color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
form.q{display:flex;gap:8px;max-width:420px;margin-top:14px}form.q input{flex:1}
.verdict{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:14px}
.verdict>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 14px}
.verdict .l{font-size:13px;color:var(--mute)}
.verdict .v{font-family:var(--serif);font-size:22px;line-height:1.2}
.verdict .r{font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{padding-top:12px}
.phead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.ladder{font-family:var(--mono);font-size:13px;border:1px solid var(--line)}
.lr{display:grid;grid-template-columns:6.5em 5.5em minmax(0,1fr) 5em;gap:8px;align-items:center;padding:3px 10px;border-bottom:1px solid var(--line)}
.lr .bar{height:10px}
.lr.mid{background:var(--ink);color:var(--bg);font-weight:500}
.lr .d{color:var(--mute);text-align:right}
.ask .bar{background:var(--long)}.bid .bar{background:var(--short)}
.log{max-height:420px;overflow:auto;border:1px solid var(--line);font-size:14px}
.log div{padding:7px 10px;border-bottom:1px solid var(--line)}
.log time{font-family:var(--mono);color:var(--mute);margin-right:8px}
.log b{font-weight:600}
.B{color:var(--short)}.A{color:var(--long)}.up{color:var(--up)}.dn{color:var(--dn)}
.fig{position:relative;min-height:240px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:2}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:4px}
.vp{min-height:420px}
ul.st{list-style:none;margin:0;padding:0;font-size:15px}
ul.st li{padding:8px 0;border-bottom:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.chk input{min-height:auto;width:18px;height:18px}
</style>
<link rel="stylesheet" href="./theme.css">
</head>

<section class="band grid2" style="padding-top:0">
  <div class="panel">
    <div class="phead"><h2>호가 벽</h2><span class="sub" style="margin:0">±3% 안에서 평소 호가의 8배 이상인 주문</span></div>
    <div class="ladder" id="ladder"><div class="lr"><span class="sub">연결 중…</span></div></div>
  </div>

    <div class="phead"><h2>이상 징후 일지</h2><label class="chk"><input type="checkbox" id="snd"> 소리 알림</label></div>
    <div class="log" id="log"><div class="sub">벽 철거, 아이스버그 흡수, 큰 벽 등장이 여기 기록돼요.</div></div>
  </div>

<section class="band">
  <div class="panel">
    <div class="phead"><h2>현물 vs 선물 CVD <span class="sub" style="font-size:14px">페이지를 연 뒤부터, 1분 단위, USD</span></h2>
      <div class="legend"><span><i style="background:var(--ink)"></i>현물 (Bybit)</span><span><i style="background:var(--long)"></i>선물 (Bybit)</span></div></div>
    <div class="fig" id="f-cvd"></div>
  </div>
</section>

<section class="band grid2">
  <div class="panel">
    <div class="phead"><h2>볼륨 프로파일</h2><span class="sub" style="margin:0">최근 10일 15분봉</span></div>
    <div class="fig vp" id="f-vp"></div>
  </div>
  <div class="panel">
    <div class="phead"><h2>시장 구조</h2><span class="sub" style="margin:0">15분봉 기준</span></div>
    <ul class="st" id="ms"><li class="sub">불러오는 중…</li></ul>
  </div>
</section>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const num=n=>{const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(0)};
const usd=n=>(n<0?'-$':'$')+num(Math.abs(n));
const px=n=>n>=1000?n.toLocaleString('en-US',{maximumFractionDigits:2}):n>=1?n.toFixed(4).replace(/0+$/,'').replace(/\.$/,''):n.toPrecision(4);
const p2=n=>String(n).padStart(2,'0');const hms=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};const hm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

let SYM=null,BASE=null,socks=[],bids=new Map(),asks=new Map(),walls=new Map(),exec=new Map(),iceSeen=new Map(),cvdP=new Map(),cvdS=new Map(),start=0,lastPx=0,ms=null,vp=null;
$('#snd').checked=store.get('w-snd')==='1';$('#snd').addEventListener('change',e=>store.set('w-snd',e.target.checked?'1':'0'));
let actx=null;function beep(f){if(!$('#snd').checked)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.07,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.3);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.3)}catch(e){}}
const LOG=[];
function log(kind,side,html){LOG.unshift({t:Date.now(),kind,side,html});if(LOG.length>200)LOG.pop();
  $('#log').innerHTML=LOG.map(l=>`<div><time>${hms(l.t)}</time><b class="${l.side}">${esc(l.kind)}</b> ${l.html}</div>`).join('');
  if(kind!=='벽 등장')beep(side==='B'?880:440)}

function mid(){const bb=Math.max(...bids.keys()),ba=Math.min(...asks.keys());return isFinite(bb)&&isFinite(ba)?(bb+ba)/2:lastPx}
/* wall tracking every second */
function scanWalls(){
  if(!bids.size||!asks.size)return;const m=mid();
  const near=[];for(const [p,s] of bids)if(p>=m*.97)near.push(s*p);for(const [p,s] of asks)if(p<=m*1.03)near.push(s*p);
  if(near.length<10)return;const sorted=[...near].sort((a,b)=>a-b),med=sorted[Math.floor(sorted.length/2)],th=Math.max(med*8,2e4);
  const now=Date.now(),cur=new Set();
  for(const [side,book] of [['B',bids],['A',asks]])for(const [p,s] of book){const v=s*p;if(Math.abs(p/m-1)>.03||v<th)continue;const k=side+p;cur.add(k);
    const w=walls.get(k);if(!w){walls.set(k,{side,p,first:now,max:v,last:v});if(walls.size>0&&now-start>15e3)log('벽 등장',side,`${side==='B'?'매수':'매도'}벽 ${px(p)} · ${usd(v)} (현재가 대비 ${((p/m-1)*100).toFixed(2)}%)`)}
    else{w.max=Math.max(w.max,v);w.last=v}}
  for(const [k,w] of walls){if(cur.has(k))continue;
    const book=w.side==='B'?bids:asks,s=book.get(w.p)||0,left=s*w.p,dist=Math.abs(w.p/m-1);
    const traded=(exec.get(w.side+w.p)||0);
    if(left<w.max*.3){const moved=[...walls.values()].some(o=>o!==w&&o.side===w.side&&o.first>=now-3e3&&Math.abs(o.p/w.p-1)<=.002&&o.last>=w.max*.5);
      if(!moved&&dist<=.004&&traded<(w.max-left)*.3&&now-w.first>=20e3&&now-start>30e3)log(w.side==='A'?'매도벽 철거':'매수벽 철거',w.side,`${px(w.p)}의 ${usd(w.max)} 벽이 체결 없이 사라짐 (체결 ${usd(traded)}) · 현재가와 ${(dist*100).toFixed(2)}%`);walls.delete(k)}
  }
  drawLadder(m,th);
}
function drawLadder(m,th){
  const ws=[...walls.values()].sort((a,b)=>b.p-a.p);const mx=Math.max(1,...ws.map(w=>w.last));
  const row=w=>`<div class="lr ${w.side==='A'?'ask':'bid'}"><span>${px(w.p)}</span><span>${usd(w.last)}</span><span><i class="bar" style="display:block;width:${(w.last/mx*100).toFixed(0)}%"></i></span><span class="d">${((w.p/m-1)*100).toFixed(2)}%</span></div>`;
  const a=ws.filter(w=>w.side==='A').slice(-10),b=ws.filter(w=>w.side==='B').slice(0,10);
  $('#ladder').innerHTML=(a.length?a.map(row).join(''):'<div class="lr"><span class="sub">위쪽 큰 매도벽 없음</span></div>')+`<div class="lr mid"><span>${px(m)}</span><span>현재가</span><span></span><span>기준 ${usd(th)}</span></div>`+(b.length?b.map(row).join(''):'<div class="lr"><span class="sub">아래쪽 큰 매수벽 없음</span></div>');
}
/* trades: CVD + execution per level + iceberg */
function onTrade(t,spot){
  const p=+t.p,v=+t.v*p,buy=t.S==='Buy',min=Math.floor(+t.T/60e3)*60e3;
  const M=spot?cvdS:cvdP;M.set(min,(M.get(min)||0)+(buy?v:-v));
  if(spot)return;lastPx=p;
  const k=(buy?'A':'B')+p;exec.set(k,(exec.get(k)||0)+v);
  const w=walls.get(k)||null,book=buy?asks:bids,vis=(book.get(p)||0)*p;
  const maxVis=w?w.max:Math.max(vis,1);const ex=exec.get(k);
  if(ex>=maxVis*2&&ex>=5e4&&vis>=maxVis*.5&&Date.now()-(iceSeen.get(k)||0)>300e3){iceSeen.set(k,Date.now());
    log(buy?'매도 아이스버그':'매수 아이스버그 흡수',buy?'A':'B',`${px(p)}에서 ${usd(ex)} 체결됐는데 호가가 ${usd(vis)} 그대로 다시 채워짐 · ${buy?'위쪽에서 물량을 계속 내놓는 중':'아래에서 매도를 전량 받아내는 중'}`)}
}
function connect(){
  for(const s of socks)try{s.close()}catch(e){}socks=[];
  const mk=(url,args,fn)=>{let alive=true;const go=()=>{if(!alive)return;const ws=new WebSocket(url);ws._kill=()=>{alive=false;ws.close()};socks.push({close:()=>ws._kill()});
    let ka;ws.onopen=()=>{ws.send(JSON.stringify({op:'subscribe',args}));ka=setInterval(()=>ws.readyState===1&&ws.send(JSON.stringify({op:'ping'})),20000)};
    ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(er){return}if(d.topic)fn(d)};ws.onclose=()=>{clearInterval(ka);setTimeout(go,3000)}};go()};
  mk('wss://stream.bybit.com/v5/public/linear',[`orderbook.200.${SYM}`,`publicTrade.${SYM}`],d=>{
    if(d.topic.startsWith('orderbook')){if(d.type==='snapshot'){bids.clear();asks.clear()}
      for(const [p,s] of d.data.b){const P=+p,S=+s;if(S)bids.set(P,S);else bids.delete(P)}
      for(const [p,s] of d.data.a){const P=+p,S=+s;if(S)asks.set(P,S);else asks.delete(P)}}
    else for(const t of d.data)onTrade(t,false)});
  mk('wss://stream.bybit.com/v5/public/spot',[`publicTrade.${SYM}`],d=>{for(const t of d.data)onTrade(t,true)});
}
/* CVD chart */
const cb=$('#f-cvd');cb.innerHTML='<svg></svg><div class="tip"></div>';const cs=cb.querySelector('svg'),ct=cb.querySelector('.tip');
function drawCVD(){
  const W=cs.clientWidth,H=cs.clientHeight;if(!W||!H||!start)return;
  const t0=Math.max(Math.floor(start/60e3)*60e3,Math.floor(Date.now()/60e3)*60e3-1439*60e3),t1=Math.floor(Date.now()/60e3)*60e3;const n=Math.max(2,(t1-t0)/60e3+1);
  const ser=M=>{let c=0;const o=[];for(let i=0;i<n;i++){const t=t0+i*60e3;c+=M.get(t)||0;o.push([t,c])}return o};
  const S=ser(cvdS),P=ser(cvdP);const ys=[...S,...P].map(p=>p[1]);let y0=Math.min(0,...ys),y1=Math.max(0,...ys);const pd=(y1-y0)*.1||1;y0-=pd;y1+=pd;
  const narrow=W<520,pl=narrow?6:60,pr=8,pt=8,pb=narrow?8:22;const X=t=>pl+(t-t0)/Math.max(60e3,t1-t0)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  let g=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mute)"/>`;
  if(!narrow){for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--mute)">${usd(v)}</text>`}g+=`<text x="${pl}" y="${H-5}" font-size="12" fill="var(--mute)">${hm(t0)}</text><text x="${W-pr}" y="${H-5}" text-anchor="end" font-size="12" fill="var(--mute)">${hm(t1)}</text>`}
  const path=s=>s.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('');
  cs.innerHTML=g+`<path d="${path(P)}" fill="none" stroke="var(--long)" stroke-width="2"/><path d="${path(S)}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  cs.onpointermove=e=>{const r=cs.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left-pl)/(W-pl-pr)*(n-1))));ct.style.display='block';ct.style.left=Math.min(Math.max(X(S[i][0]),100),W-100)+'px';ct.style.top=(e.clientY-r.top)+'px';ct.textContent=`${hm(S[i][0])} · 현물 ${usd(S[i][1])} · 선물 ${usd(P[i][1])}`};
  cs.onpointerleave=()=>{ct.style.display='none'};
  return{s:S.at(-1)[1],p:P.at(-1)[1]};
}
const cvdRO=new ResizeObserver(drawCVD);cvdRO.observe(cs);
/* volume profile + structure from 15m klines */
async function loadStructure(){
  const r=await j(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${SYM}&interval=15&limit=1000`);
  const K=r.result.list.map(a=>({t:+a[0],o:+a[1],h:+a[2],l:+a[3],c:+a[4],q:+a[6]})).sort((a,b)=>a.t-b.t);
  const H=Math.max(...K.map(k=>k.h)),L=Math.min(...K.map(k=>k.l)),NB=60,st=(H-L)/NB,bins=new Float64Array(NB);
  for(const k of K){const a=Math.max(0,Math.floor((k.l-L)/st)),b=Math.min(NB-1,Math.floor((k.h-L)/st));const per=k.q/(b-a+1);for(let i=a;i<=b;i++)bins[i]+=per}
  const tot=bins.reduce((s,v)=>s+v,0);let poc=0;for(let i=1;i<NB;i++)if(bins[i]>bins[poc])poc=i;
  let lo=poc,hi=poc,acc=bins[poc];while(acc<tot*.7&&(lo>0||hi<NB-1)){const dn=lo>0?bins[lo-1]:-1,up=hi<NB-1?bins[hi+1]:-1;if(up>=dn){hi++;acc+=bins[hi]}else{lo--;acc+=bins[lo]}}
  const avg=tot/NB,price=K.at(-1).c,ib=Math.min(NB-1,Math.max(0,Math.floor((price-L)/st)));
  const lvn=[];for(let i=0;i<NB;i++)if(bins[i]<avg*.35)lvn.push(i);
  vp={bins:[...bins],L,st,poc,lo,hi,price,ib,lvn,NB,VAH:L+(hi+1)*st,VAL:L+lo*st,POC:L+(poc+.5)*st};
  // swings
  const sw=[];for(let i=3;i<K.length-3;i++){const k=K[i];if(K.slice(i-3,i+4).every(x=>x.l>=k.l))sw.push({i,t:k.t,type:'L',p:k.l});if(K.slice(i-3,i+4).every(x=>x.h<=k.h))sw.push({i,t:k.t,type:'H',p:k.h})}
  const N=K.length;let bull=null,bear=null;
  for(let i=N-24;i<N;i++){if(i<0)continue;const k=K[i];
    const pl=sw.filter(s=>s.type==='L'&&s.i<i-1).at(-1);if(pl&&k.l<pl.p&&k.c>pl.p){const ph=sw.filter(s=>s.type==='H'&&s.i<i&&s.i>pl.i-20).at(-1);const brk=ph?K.slice(i+1).find(x=>x.c>ph.p):null;bull={sweep:k.t,lv:pl.p,mss:brk?brk.t:null,mssLv:ph?ph.p:null}}
    const pH=sw.filter(s=>s.type==='H'&&s.i<i-1).at(-1);if(pH&&k.h>pH.p&&k.c<pH.p){const pL=sw.filter(s=>s.type==='L'&&s.i<i&&s.i>pH.i-20).at(-1);const brk=pL?K.slice(i+1).find(x=>x.c<pL.p):null;bear={sweep:k.t,lv:pH.p,mss:brk?brk.t:null,mssLv:pL?pL.p:null}}}
  ms={bull,bear};drawVP();renderMS();
}
const vb=$('#f-vp');vb.innerHTML='<svg></svg>';const vs=vb.querySelector('svg');
function drawVP(){if(!vp)return;const W=vs.clientWidth,H=vs.clientHeight;if(!W||!H)return;
  const {bins,NB,poc,lo,hi,ib,lvn}=vp,mx=Math.max(...bins),bh=H/NB,pl=W<520?60:80;let g='';
  for(let i=0;i<NB;i++){const y=H-(i+1)*bh,w=bins[i]/mx*(W-pl-10);const inVA=i>=lo&&i<=hi;g+=`<rect x="${pl}" y="${(y+.5).toFixed(1)}" width="${Math.max(1,w).toFixed(1)}" height="${Math.max(1,bh-1).toFixed(1)}" fill="${i===poc?'var(--ink)':inVA?'var(--mute)':'var(--line)'}" opacity="${inVA?.75:1}"/>`}
  const yl=v=>H-((v-vp.L)/vp.st)*bh;
  const lab=(v,t,c)=>`<line x1="${pl-4}" x2="${W}" y1="${yl(v)}" y2="${yl(v)}" stroke="${c}" stroke-dasharray="${t==='현재가'?'':'4 3'}"/><text x="${pl-8}" y="${yl(v)+4}" text-anchor="end" font-size="12" fill="${c}">${t}</text>`;
  g+=lab(vp.VAH,'VAH','var(--mute)')+lab(vp.VAL,'VAL','var(--mute)')+lab(vp.POC,'POC','var(--ink)')+lab(vp.price,'현재가','var(--long)');
  vs.innerHTML=g}
const vpRO=new ResizeObserver(drawVP);vpRO.observe(vs);
function renderMS(){
  const f=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'';
  const {bull,bear}=ms;const it=[];
  it.push(bull?`<li><b class="B">하단 유동성 스윕</b> ${f(bull.sweep)} · 스윙 저점 ${px(bull.lv)} 아래를 찍고 회복${bull.mss?` → <b class="B">상승 MSS</b> ${f(bull.mss)} (${px(bull.mssLv)} 돌파)`:` · 아직 MSS 없음 (${bull.mssLv?px(bull.mssLv)+' 종가 돌파 대기':'기준 고점 없음'})`}</li>`:'<li>최근 6시간 하단 스윕 없음</li>');
  it.push(bear?`<li><b class="A">상단 유동성 스윕</b> ${f(bear.sweep)} · 스윙 고점 ${px(bear.lv)} 위를 찍고 반락${bear.mss?` → <b class="A">하락 MSS</b> ${f(bear.mss)}`:''}</li>`:'<li>최근 6시간 상단 스윕 없음</li>');
  const v=vp;const inL=v.lvn.includes(v.ib),aboveVA=v.price>v.VAH,lvAbove=v.lvn.filter(i=>i>v.ib&&i<v.ib+6).length;
  it.push(`<li>가격 위치: ${aboveVA?'<b class="B">가치 영역(VAH) 위 안착</b>':v.price<v.VAL?'<b class="A">가치 영역(VAL) 아래</b>':'가치 영역 안'} · POC ${px(v.POC)}</li>`);
  it.push(`<li>${inL?'<b class="B">매물 공백(LVN) 구간 안</b> · 저항이 얇아 빠르게 움직일 수 있음':lvAbove?`바로 위 ${lvAbove}칸이 매물 공백(LVN)`:'주변에 매물 공백 구간 없음'}</li>`);
  $('#ms').innerHTML=it.join('');
  verdict();
}
function verdict(){
  if(!vp)return;const sum=M=>{let x=0;for(const v of M.values())x+=v;return x};const c={s:sum(cvdS),p:sum(cvdP)};
  const bw=[...walls.values()].filter(w=>w.side==='B').reduce((s,w)=>s+w.last,0),aw=[...walls.values()].filter(w=>w.side==='A').reduce((s,w)=>s+w.last,0);
  const ice=LOG.filter(l=>l.kind.includes('아이스버그')&&l.side==='B').length,pull=LOG.filter(l=>l.kind==='매도벽 철거').length;
  const cells=[
    ['현물 CVD (연 뒤부터)',`<span class="${c.s>=0?'up':'dn'}">${usd(c.s)}</span>`,c.s>0&&c.p<=c.s?'현물이 끌고 감':c.p>0&&c.s<=0?'선물만 매수, 현물은 매도':''],
    ['선물 CVD (연 뒤부터)',`<span class="${c.p>=0?'up':'dn'}">${usd(c.p)}</span>`,''],
    ['호가 벽 (±3%)',`<span class="B">${usd(bw)}</span> / <span class="A">${usd(aw)}</span>`,'매수벽 / 매도벽'],
    ['흡수·철거 신호',`${ice} / ${pull}`,'매수 아이스버그 / 매도벽 철거'],
    ['구조',ms&&ms.bull&&ms.bull.mss?'<span class="B">스윕 후 상승 MSS</span>':ms&&ms.bull?'스윕 후 MSS 대기':'신호 없음',''],
    ['매물대',vp.price>vp.VAH?(vp.lvn.includes(vp.ib)?'<span class="B">VAH 위 + LVN</span>':'<span class="B">VAH 위</span>'):vp.price<vp.VAL?'VAL 아래':'가치 영역 안','']];
  $('#vd').innerHTML=cells.map(([l,v,r])=>`<div><div class="l">${l}</div><div class="v">${v}</div><div class="r">${r||'&nbsp;'}</div></div>`).join('');
}
async function startWatch(q){
  q=q.trim().toUpperCase().replace(/USDT$/,'');if(!q)return;$('#stat').textContent='종목 확인 중…';
  let sym=null;for(const s of [q+'USDT','1000'+q+'USDT','10000'+q+'USDT']){try{const r=await j(`https://api.bybit.com/v5/market/tickers?category=linear&symbol=${s}`);if(r.result?.list?.length){sym=s;break}}catch(e){}}
  if(!sym){$('#stat').textContent=`Bybit 무기한 선물에 ${q}가 없어요.`;return}
  SYM=sym;BASE=q;bids.clear();asks.clear();walls.clear();exec.clear();iceSeen.clear();cvdP.clear();cvdS.clear();LOG.length=0;start=Date.now();vp=null;ms=null;
  $('#log').innerHTML='<div class="sub">감시 시작. 이상 징후가 생기면 여기에 기록돼요.</div>';
  $('#sym').textContent=q;document.title=q+' 호가 감시 · 온체인 데스크';store.set('w-sym',q);try{history.replaceState(null,'','#'+q)}catch(e){}
  $('#stat').textContent=`Bybit ${sym} 호가 200단계·현물/선물 체결 실시간 감시 · ${hm(start)}부터`;
  connect();loadStructure().catch(e=>{$('#ms').innerHTML=`<li class="sub">구조 데이터를 불러오지 못했어요: ${esc(e.message)}</li>`});
}
$('#qf').addEventListener('submit',e=>{e.preventDefault();startWatch($('#q').value)});
setInterval(scanWalls,1000);setInterval(()=>{drawCVD();verdict()},5000);setInterval(()=>{if(SYM&&!document.hidden)loadStructure().catch(()=>{})},300e3);
setInterval(()=>{const cut=Date.now()-1800e3;if(exec.size>5000)exec.clear();for(const [k,t] of iceSeen)if(t<cut)iceSeen.delete(k)},60e3);
const s0=decodeURIComponent(location.hash.slice(1))||store.get('w-sym')||'BTC';$('#q').value=s0;startWatch(s0);
}
